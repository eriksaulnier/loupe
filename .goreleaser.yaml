version: 2

project_name: loupe

builds:
  - id: loupe
    main: ./cmd/loupe
    binary: loupe
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: loupe
    ids:
      - loupe
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: eriksaulnier
    name: loupe
