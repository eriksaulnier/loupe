version: 2

project_name: loupe

builds:
  - id: loupe
    main: ./cmd/loupe
    binary: loupe
    env:
      - CGO_ENABLED=0
    # The tag is the version loupe --version prints; a build without it says "dev".
    ldflags:
      - -s -w -X github.com/eriksaulnier/loupe/internal/cli.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: loupe
    ids:
      - loupe
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # loupe update runs the latest release's install.sh, and refuses one these checksums do not cover.
  extra_files:
    - glob: ./install.sh

# Signs and notarizes the darwin binaries before they are archived, so checksums.txt covers the signed bytes. Off when
# the secrets are absent, which is every build but release.yml's goreleaser job: snapshots and pre-releases stay unsigned
# because prerelease.yml builds a branch's code and MUST NOT hold the certificate.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

# release-please owns the changelog and creates the release as a draft. goreleaser attaches the archives to it, then
# publishes it. An immutable release takes no new assets once published, so the order is load-bearing.
changelog:
  disable: true

release:
  mode: keep-existing
  # A draft is invisible to a lookup by tag, so goreleaser finds release-please's draft by name. release-please names
  # it after the tag. If the names drift apart, goreleaser creates and publishes a second release instead.
  use_existing_draft: true
  name_template: "{{ .Tag }}"
  # A retried run finds the assets an earlier attempt uploaded to the draft, and GitHub refuses a second upload by the
  # same name.
  replace_existing_artifacts: true
  extra_files:
    - glob: ./install.sh
  github:
    owner: eriksaulnier
    name: loupe
