[tools]
# Exact, unlike the tools below: both carry rule sets that gate a commit, and a new rule in a patch
# release turns the runner red while a developer who has not run `mise up` stays green. That gap is
# what the shellcheck pin exists to close, so it MUST NOT be reopened one tier up. Bump deliberately.
actionlint = "1.7.12"
# actionlint runs its shellcheck pass over run: blocks only where shellcheck exists.
shellcheck = "0.11.0"
go = "1.25"
golangci-lint = "2"
goreleaser = "2"
lefthook = "2"
# Exact, and NOT 0.12.0: on darwin/arm64 that release writes neither its gif nor its screenshots and still
# exits 0. Verify a bump by hand, on a Mac, before taking it.
vhs = "0.11.0"

# Inside the repository, loupe resolves to this worktree's dev build rather than the installed release.
[env]
_.path = ["{{config_root}}/dist"]

[tasks.lint]
run = "golangci-lint run"

[tasks.test]
run = "go test ./..."

[tasks.check]
run = "go vet ./... && golangci-lint run && actionlint && ./scripts/check-tests.sh && go test ./..."

# The version is stamped in so a build reports what it came from rather than "dev".
[tasks.build]
run = 'CGO_ENABLED=0 go build -ldflags "-X github.com/eriksaulnier/loupe/internal/cli.version=$(git describe --tags --always --dirty)" -o dist/loupe ./cmd/loupe'

# Built rather than go run, which would turn loupe's exit codes 1 and 2 into 1.
[tasks.build-demo]
run = "go build -o dist/loupe-demo ./cmd/loupe-demo"

# Seeded runs and an in-memory GitHub, for trying the review interface and publish by hand; see cmd/loupe-demo.
[tasks.demo]
depends = ["build-demo"]
run = "dist/loupe-demo"

# Redraws the README's images from the tapes in docs/tapes. vhs renders headless, so this needs no terminal,
# unlike demo. The gif's frame timing moves between runs even when nothing changed, so regenerate
# deliberately and read the diff. Nothing checks that the images match the interface they show.
[tasks.screenshots]
depends = ["build-demo"]
run = '''
# vhs needs ttyd and ffmpeg, which are not pinned above: ttyd publishes no macOS binary, so both are the
# platform package manager's. Run each rather than look it up: a Homebrew ffmpeg left linked against an
# upgraded x265 is still on PATH and still dies on every call, and vhs reports success either way.
ttyd --version >/dev/null 2>&1 || { echo "screenshots: vhs needs a working ttyd; brew install ttyd" >&2; exit 1; }
# ffmpeg spells the flag -version, not --version.
ffmpeg -version >/dev/null 2>&1 || { echo "screenshots: vhs needs a working ffmpeg; brew install ffmpeg" >&2; exit 1; }
for tape in docs/tapes/*.tape; do vhs "$tape"; done
'''

# Redraws the README's picture of a published review from GitHub's own render: it posts the demo's review to a scratch
# pull request and captures it, so it needs gh auth and the network. See scripts/review-screenshot.sh.
[tasks.review-screenshot]
confirm = "Post (or, with LOUPE_SCREENSHOT_REVIEW, recapture) a review on eriksaulnier/loupe-sandbox#1 and redraw docs/assets/review*.png?"
run = "./scripts/review-screenshot.sh"

# Links this worktree's build as github:eriksaulnier/loupe@dev and pins it globally, so every shell and agent session
# runs it, not only those inside the repository. Run unlink before removing the worktree.
[tasks.link]
depends = ["build"]
run = '''
mkdir -p "{{config_root}}/dist/dev/bin"
ln -sfn ../../loupe "{{config_root}}/dist/dev/bin/loupe"
mise link --force github:eriksaulnier/loupe@dev "{{config_root}}/dist/dev"
# Offline, so mise pins the linked build without listing the repository's releases.
MISE_OFFLINE=1 mise use --global github:eriksaulnier/loupe@dev
'''

[tasks.unlink]
run = "mise use --global github:eriksaulnier/loupe@latest && mise uninstall github:eriksaulnier/loupe@dev"

# --skill loads the workflow skill from the working tree for one Pi session. Codex has no per-session equivalent.
[tasks.pi]
depends = ["build"]
run = 'pi --skill "{{config_root}}/plugin/skills/human-review"'

# --plugin-dir loads the skill from the working tree for one session, so edits need no reinstall.
[tasks.claude]
depends = ["build"]
run = 'claude --plugin-dir "{{config_root}}/plugin"'
