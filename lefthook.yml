pre-commit:
  commands:
    check:
      run: mise run check

commit-msg:
  commands:
    conventional:
      run: |
        subject="$(head -n1 {1})"
        if ! printf '%s' "$subject" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-z]'; then
          echo "commit-msg: subject must be a Conventional Commit with a lowercase summary: $subject" >&2
          exit 1
        fi
        if [ "${#subject}" -gt 72 ]; then
          echo "commit-msg: subject is ${#subject} characters; maximum is 72" >&2
          exit 1
        fi
        case "$subject" in
          *.) echo "commit-msg: subject ends with a period" >&2; exit 1 ;;
        esac
