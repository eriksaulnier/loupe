name: Bug report
description: loupe did something it should not have, or refused something it should have allowed
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: loupe version
      description: The output of `loupe --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, terminal, and the values of `TERM`, `LANG`/`LC_ALL` and `LOUPE_ICONS` if set.
      placeholder: macOS 15, Ghostty, TERM=xterm-ghostty, LANG=en_US.UTF-8
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The command you ran, with its arguments and any JSON input.
      render: sh
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The `--json` result, or the `error:` and `fix:` lines from stderr. Remove tokens and private repository content.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual
      description: What you expected to happen, and what happened instead.
    validations:
      required: true
