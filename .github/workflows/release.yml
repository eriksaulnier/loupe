name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # GITHUB_TOKEN opens the release pull request, and a pull request opened with that token starts no ci.yml run, so
  # this is the build to try before merging. It builds main's head, not the pull request's: release-please refreshes
  # its branch only when the changelog changes, and the merge releases main's code either way. Publishes nothing.
  snapshot:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release-please--branches--main
        run: |
          set -euo pipefail
          open="$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq length)"
          if [ "$open" = 0 ]; then
            echo "No open release pull request, so there is nothing to try."
            exit 0
          fi
          version="$(gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=$BRANCH" | jq -r '."."')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.next.outputs.version
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: steps.next.outputs.version
        uses: jdx/mise-action@v5
      # goreleaser takes the version from this tag, which does not exist yet, so the archives name the version the
      # merge would release, as X.Y.Z-SNAPSHOT-<commit>.
      - if: steps.next.outputs.version
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GORELEASER_CURRENT_TAG: v${{ steps.next.outputs.version }}
      # One name across versions, so docs/releasing.md can find the newest without knowing the version.
      - if: steps.next.outputs.version
        uses: actions/upload-artifact@v7
        with:
          name: loupe-snapshot
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

  # release-please cuts the tag and a draft release with GITHUB_TOKEN, and a tag made with that token triggers no other
  # workflow, so goreleaser runs here, gated on it.
  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: mise run check
      # goreleaser creates and publishes a release of its own when it finds no draft by this name, which an immutable
      # release would make permanent.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          drafts="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft and .name == env.TAG) | .id' | wc -l | tr -d ' ')"
          [ "$drafts" = 1 ] || { echo "::error::want exactly one draft release named $TAG for goreleaser to publish, found $drafts"; exit 1; }
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After goreleaser, not beside it: the release stays a draft, whose download URLs 404, until goreleaser has
  # uploaded the archives this release's action default names and published it.
  install-action:
    needs: [release-please, goreleaser]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./
      - env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          want="loupe version ${TAG#v}"
          got="$(loupe --version)"
          [ "$got" = "$want" ] || { echo "::error::loupe --version printed '$got', want '$want'"; exit 1; }

  # No pin, so this also proves that latest resolves to the new release.
  install-script:
    needs: [release-please, goreleaser]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          LOUPE_INSTALL_DIR="$RUNNER_TEMP/loupe-bin" sh install.sh
          want="loupe version ${TAG#v}"
          got="$("$RUNNER_TEMP/loupe-bin/loupe" --version)"
          [ "$got" = "$want" ] || { echo "::error::loupe --version printed '$got', want '$want'"; exit 1; }
