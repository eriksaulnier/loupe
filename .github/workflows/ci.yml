name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run check

  # Pull requests only: a release pull request, and the push that merges it, stamp a default whose archives
  # goreleaser has not uploaded yet. release.yml runs the same check once they exist.
  install-action:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
    strategy:
      fail-fast: false
      matrix:
        # One runner per goreleaser target.
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./
      # TestInstallAction pins the action's default to the manifest version.
      - run: |
          set -euo pipefail
          want="loupe version $(jq -r '."."' .release-please-manifest.json)"
          got="$(loupe --version)"
          [ "$got" = "$want" ] || { echo "::error::loupe --version printed '$got', want '$want'"; exit 1; }
          case "$(command -v loupe)" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "::error::loupe resolved to $(command -v loupe), outside RUNNER_TEMP"; exit 1 ;;
          esac
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::the action wrote into the workspace"
            exit 1
          fi

  install-action-unsupported:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - id: install
        uses: ./
        continue-on-error: true
      - if: steps.install.outcome != 'failure'
        shell: bash
        run: |
          echo "::error::the action installed on Windows, which loupe has no build for"
          exit 1
