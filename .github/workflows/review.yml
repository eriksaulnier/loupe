name: review

# The plumbing lives in eriksaulnier/loupe-workflows, shared with the other repositories reviewed this
# way. What stays here is what only this repository can answer: when a round is asked for, whether
# rounds are turned on at all, and which model reviews. The per-round guidance is in
# .github/review-instructions.md, read from the default branch and never from the pull request.
#
# A pull request opened ready gets one round unasked. One opened as a draft gets it when it is
# marked ready. Every round after that is asked for by putting the ai-review label back on.
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to review
        required: true
        type: number
  pull_request:
    types: [opened, ready_for_review, labeled]

jobs:
  review:
    # Kill switch: flip the REVIEW_ENABLED repository variable to "true" to let a round run at all.
    if: vars.REVIEW_ENABLED == 'true'
    # A called workflow's job permissions are capped by this job's, so the four the called jobs ask
    # for are granted here or the publishing job gets a read-only token and fails at the send.
    permissions:
      contents: read
      pull-requests: write
      checks: read
      actions: read
    uses: eriksaulnier/loupe-workflows/.github/workflows/review.yml@7365da6ea92b2da97cc663ef810fd425d6f18806 # v2.0.0
    with:
      pull_request: ${{ inputs.pull_request || github.event.pull_request.number }}
      model: ${{ vars.REVIEW_MODEL }}
      debug: ${{ vars.REVIEW_DEBUG == 'true' }}
      # The default 40 ran out before publishing on several large loupe pull requests, which then got
      # no review at all.
      max_turns: 80
      # loupe dogfoods its own sticky review. Sticky finds the review to edit by its source name, so
      # source MUST stay at its default for every round.
      sticky: true
    secrets:
      openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
