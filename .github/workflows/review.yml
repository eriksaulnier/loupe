name: review

# Two ways in, both a person's deliberate act: naming a pull request in a dispatch, or putting the
# review label on one. The label is how a round is asked for again — take it off and put it back.
# There is still no trigger that reviews a pull request nobody asked about.
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to review
        required: true
        type: number
  pull_request:
    types: [labeled]

# The reviewing job and the publishing job are split so that the agent never holds a token that can
# write to the pull request: the action embeds the token it is given into the workspace's .git/config
# before it starts Claude, and a review is exactly the place untrusted text is read. Publish needs no
# clone (spec 007 FR-003), so the data root travels between them as an artifact.
permissions:
  contents: read

# One round at a time per pull request. A label added again while a round is running queues behind
# it rather than racing it, since two rounds publishing at once would post two reviews.
concurrency:
  group: review-${{ inputs.pull_request || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    # Kill switch: flip the REVIEW_ENABLED repository variable to "true" to let this job run at all.
    # A label event only counts when it is the review label, so every other label leaves this alone.
    if: >-
      vars.REVIEW_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-review')
    permissions:
      contents: read
      pull-requests: read
      # For the check runs on the captured commit, which the prompt hands the reviewer as fact.
      checks: read
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
    env:
      # Set in the first step rather than here: the runner context is not available to a job's env.
      LOUPE_HOME: ""
      GITHUB_TOKEN: ${{ github.token }}
      PULL_REQUEST: ${{ inputs.pull_request || github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check pull request eligibility
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "LOUPE_HOME=$RUNNER_TEMP/loupe-home" >> "$GITHUB_ENV"
          pr_json=$(gh api "repos/$REPOSITORY/pulls/$PULL_REQUEST")
          draft=$(echo "$pr_json" | jq -r .draft)
          head_repo=$(echo "$pr_json" | jq -r .head.repo.full_name)
          head_ref=$(echo "$pr_json" | jq -r .head.ref)
          author=$(echo "$pr_json" | jq -r .user.login)
          skip=false
          [ "$draft" = "true" ] && skip=true
          [ "$head_repo" != "$REPOSITORY" ] && skip=true
          case "$head_ref" in release-please--*) skip=true ;; esac
          [ "$author" = "dependabot[bot]" ] && skip=true
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      # main at the workspace root, which is the base the reviewing action expects to run in, and the
      # only source loupe's own binary is built from: a pull request cannot change the code that holds
      # the write token.
      - name: Check out main
        if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          # Pinned, because a dispatch can name any branch, and without this the binary holding the
          # write token would be built from whichever one was chosen.
          ref: main
          # Capture fetches the pull request's head and base into this clone and asks for their merge
          # base, which a shallow clone cannot answer.
          fetch-depth: 0

      - name: Set up Go
        if: steps.pr.outputs.skip != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build loupe from main
        if: steps.pr.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/loupe-bin"
          go build -o "$RUNNER_TEMP/loupe-bin/loupe" ./cmd/loupe
          echo "$RUNNER_TEMP/loupe-bin" >> "$GITHUB_PATH"

      # The only step that needs the clone (spec 007 FR-002). Its `--json` result names the run; every
      # later step passes that reference on through LOUPE_RUN rather than resolving one of its own.
      # The model is recorded here rather than required by loupe (spec 008 FR-016, FR-017): this
      # workflow always knows it, so an empty variable is a configuration error and stops the job.
      - name: Capture the pull request
        if: steps.pr.outputs.skip != 'true'
        env:
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
        run: |
          if [ -z "$REVIEW_MODEL" ]; then
            echo "::error::the REVIEW_MODEL repository variable is empty; set it to the model id the review step uses"
            exit 1
          fi
          result=$(loupe capture "https://github.com/$REPOSITORY/pull/$PULL_REQUEST" \
            --source loupe-review-action --model "$REVIEW_MODEL" --json)
          {
            echo "LOUPE_RUN=$(echo "$result" | jq -r .run)"
            echo "LOUPE_HEAD_SHA=$(echo "$result" | jq -r .target.headSha)"
            echo "LOUPE_ROUND=$(echo "$result" | jq -r .target.round)"
          } >> "$GITHUB_ENV"

      # review/ is the pull request: its files at the captured head, with symlinks dropped so no file
      # tool can follow one out of it, and a copy of the captured diff. `loupe show` does not expose
      # the diff and the agent has no git, so without this copy it could read the code but not tell
      # what changed. The workspace around it stays main, which is what the action runs in.
      - name: Lay out the review directory
        if: steps.pr.outputs.skip != 'true'
        run: |
          mkdir -p review/head
          git archive "$LOUPE_HEAD_SHA" | tar -x -C review/head
          find review/head -type l -delete
          # Reaches into loupe's on-disk run layout, which the CLI contract does not promise. A loupe
          # command that hands back the captured diff would replace this.
          cp "$LOUPE_HOME/runs/$REPOSITORY/$PULL_REQUEST/$LOUPE_ROUND/pr.diff" review/pr.diff

      # What this repository's own checks already say about the commit under review. Without it a
      # reviewer guesses, and a guess that the build is broken reads as a blocking finding.
      - name: Read the checks on the captured head
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Settled checks only, and not this workflow's own jobs: a round triggered by a label runs
          # while its pull request's checks are still going, and reporting itself as in_progress
          # tells the reviewer nothing it can rely on.
          checks=$(gh api "repos/$REPOSITORY/commits/$LOUPE_HEAD_SHA/check-runs" \
            --jq '[.check_runs[]
                   | select(.status == "completed")
                   | select(.name != "review" and .name != "publish" and .name != "unlabel")
                   | "\(.name): \(.conclusion)"] | unique | join(", ")' || true)
          [ -n "$checks" ] || checks="none finished yet"
          echo "REVIEW_CHECKS=$checks" >> "$GITHUB_ENV"

      # Claude Code, routed through OpenRouter's Anthropic-compatible endpoint. `--allowedTools` is the
      # only way this step can run `loupe` at all: the action grants no Bash access by default, and a
      # command outside the list is refused rather than asked about. It allows exactly what spec 007
      # FR-033 does; a blanket `Bash(*)` denial would outrank those allow rules and take the six with it.
      - name: Review the pull request
        if: steps.pr.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Without this the action finds no token and asks for an OIDC one instead, which this job
          # has no id-token permission for, so it fails before the reviewer starts.
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # The action hides the agent's output by default, which leaves a failed review with nothing
          # to read but a turn count. Set the REVIEW_DEBUG variable to see it; the log is as
          # public as this repository, so it stays off unless someone is diagnosing a run.
          show_full_output: ${{ vars.REVIEW_DEBUG == 'true' }}
          claude_args: |
            --model ${{ vars.REVIEW_MODEL }}
            --add-dir review
            --max-turns 40
            --allowedTools "Write,Bash(loupe --help),Bash(loupe capture --help),Bash(loupe add --help),Bash(loupe add:*),Bash(loupe edit --help),Bash(loupe edit:*),Bash(loupe summary --help),Bash(loupe summary:*),Bash(loupe wait --help),Bash(loupe handoff --help),Bash(loupe reply --help),Bash(loupe feedback --help),Bash(loupe show --help),Bash(loupe show:*),Bash(loupe list --help),Bash(loupe review --help),Bash(loupe publish --help)"
          prompt: |
            You are reviewing one pull request for this repository. Read `loupe --help` first; every
            subcommand's `--help` shows its JSON input and its result.

            **Where things are.** You are running in a checkout of this repository's `main` branch.
            That is not what you are reviewing; it is what the `loupe` binary you run was built from.
            The pull request is in `$GITHUB_WORKSPACE/review`: `review/head/` holds its files at the
            commit loupe captured, and `review/pr.diff` is the diff under review. Nothing outside the
            directory you are running in can be read.

            **What to review.** The diff, and the code it touches. Not the rest of the repository,
            and not the pull request's description, which you do not have. Report what you would
            stop a colleague over: a bug, a case the change does not handle, a security or data-loss
            risk, a contract or documentation statement the change makes untrue. Say nothing about
            formatting, import order or naming style: `gofmt`, `golangci-lint`, `actionlint` and
            `shellcheck` already run on every commit, and a finding they would have made is noise.

            **What is already known about this commit.** These checks have finished: ${{ env.REVIEW_CHECKS }}.
            Take that as fact. A finding that contradicts it — that the build fails, that a lint
            rejects this, that a referenced action or tool does not exist — is wrong unless you can
            point at the line that makes it true, and it MUST NOT be filed as blocking.

            **What you can stand behind.** You cannot run commands, run tests or reach the network,
            so every claim MUST rest on something you read in `review/head/` or `review/pr.diff`.
            Mark a finding `"blocking": true` only when you traced the failure through the code and
            can name the path: which input reaches which line and what it does there. Everything you
            reasoned about but could not confirm is a `question`, not an issue. Set `confidence` to
            `high` only for what you traced; use `medium` or `low` otherwise, and say in the body
            what you could not check.

            **How to file.** Write your findings to `findings.json` and run
            `loupe add --from findings.json`. Do not pipe the JSON in on stdin: a heredoc full of
            JSON braces is refused before it reaches `loupe`, and working around that costs you
            turns. The file is one JSON array, each entry with `title`, `body`, `label` (`issue`,
            `suggestion` or `question`), `blocking`, `confidence`, optional `severity`, and either
            `location` (`path`, `line`, and `startLine` for a range) or `"general": true`. Paths and
            lines are the diff's, as `review/pr.diff` gives them; a location that is not in the diff
            is refused with the nearest valid lines, so correct it or file that finding as
            `general`. The whole array is stored or none of it is, so a refusal means fixing the one
            entry and running it again.

            Finish with `loupe summary --body`, or `--from` a file you wrote: two or three sentences on what the change does and
            what you found, and, when you left something unchecked, one sentence naming it. Write the
            summary even when you found nothing; a review that says a change looks sound is a result.

            **What not to run.** Only `loupe --help`, a subcommand's `--help`, `loupe add`,
            `loupe edit`, `loupe summary` and `loupe show` are available to you. Do not run
            `loupe publish`, `loupe review`, `loupe capture`, `loupe wait`, `loupe handoff`,
            `loupe feedback`, `loupe reply` or `loupe list`, and do not run git or any other command.
            A separate step publishes what you filed; you never post to GitHub yourself.
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}

      # The draft the agent filed, handed to the job that may publish it.
      - name: Upload the data root
        if: always() && steps.pr.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: loupe-home-${{ inputs.pull_request || github.event.pull_request.number }}
          path: ${{ env.LOUPE_HOME }}
          include-hidden-files: true
          if-no-files-found: ignore

  # The only job holding a token that can write to the pull request. No agent runs here, and the
  # pull request's own content never reaches this workspace: it publishes a draft loupe already
  # composed, and the body it sends passes the Markdown allowlist before anything is sent.
  publish:
    needs: review
    if: needs.review.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # For listing this run's artifacts, which is how the step below knows whether this job has
      # already published once.
      actions: read
    env:
      LOUPE_HOME: ""
      GITHUB_TOKEN: ${{ github.token }}
      PULL_REQUEST: ${{ inputs.pull_request || github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build loupe from main
        run: |
          mkdir -p "$RUNNER_TEMP/loupe-bin"
          go build -o "$RUNNER_TEMP/loupe-bin/loupe" ./cmd/loupe
          echo "$RUNNER_TEMP/loupe-bin" >> "$GITHUB_PATH"
          echo "LOUPE_HOME=$RUNNER_TEMP/loupe-home" >> "$GITHUB_ENV"

      # Restored rather than re-captured: the run keeps its attempts and receipts, so a receipt
      # replays and an unknown attempt reconciles instead of posting the review a second time.
      #
      # This job's own state comes first. A re-run that started from the reviewing job's snapshot
      # would hold neither attempt.json nor receipt.json, so it would mint a new publication id and
      # could post the review GitHub already has.
      # Asked about rather than attempted: a download of an artifact that is not there fails the step,
      # and a first attempt would report that failure on every run that went right.
      - name: Look for this job's publication state
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="loupe-home-published-$PULL_REQUEST"
          # A failed listing is not an absent artifact. Answering "not found" to both would restore
          # the pre-publication draft on a retry, which is the double-post this check exists to stop.
          if ! names=$(gh api "repos/$REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].name'); then
            echo "could not list this run's artifacts, so whether this job already published is unknown." >&2
            echo "publishing now could post a review twice; check the pull request before re-running." >&2
            exit 1
          fi
          if grep -qxF "$name" <<<"$names"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore this job's publication state
        if: steps.published.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          name: loupe-home-published-${{ inputs.pull_request || github.event.pull_request.number }}
          path: ${{ env.LOUPE_HOME }}

      - name: Refuse a retry that cannot recover its publication state
        if: steps.published.outputs.found != 'true' && github.run_attempt != 1
        run: |
          echo "attempt $GITHUB_RUN_ATTEMPT found no loupe-home-published-$PULL_REQUEST artifact." >&2
          echo "An earlier attempt may have posted a review this one cannot see; publishing now could post it twice." >&2
          echo "Check the pull request, then publish by hand from the artifact." >&2
          exit 1

      - name: Restore the captured draft
        if: steps.published.outputs.found != 'true'
        uses: actions/download-artifact@v8
        with:
          name: loupe-home-${{ inputs.pull_request || github.event.pull_request.number }}
          path: ${{ env.LOUPE_HOME }}

      # The run is named rather than resolved: this checkout is main, not the pull request's branch,
      # and --unattended refuses to guess from a branch for exactly that reason.
      - name: Publish unattended
        env:
          LOUPE_RUN: ${{ github.repository }}#${{ inputs.pull_request || github.event.pull_request.number }}
        run: loupe publish --unattended --json

      # The run directory is the only evidence of a publication once the runner is gone, so it is
      # kept whether the publish step succeeded, refused or failed. Overwritten rather than kept per
      # attempt, so the step above always finds the newest state under one name.
      - name: Upload the published data root
        if: always()
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: loupe-home-published-${{ inputs.pull_request || github.event.pull_request.number }}
          path: ${{ env.LOUPE_HOME }}
          include-hidden-files: true
          if-no-files-found: ignore

  # The label is the request, so it comes off once the request has been answered — including when the
  # answer was a failure, since the run happened either way. Putting it back is how the next round is
  # asked for. Only `labeled` triggers this workflow, so removing it starts nothing.
  unlabel:
    needs: [review, publish]
    # Only the round's own label comes off, and only when a round actually ran. Every other label
    # added to a pull request fires this workflow too, and deleting a label that is not there is a
    # 404 on somebody else's change; a request the kill switch turned away keeps its label, so it is
    # still there to answer when the switch goes back on.
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.label.name == 'ai-review' && needs.review.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Take the review label off
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh api -X DELETE "repos/$REPOSITORY/issues/$PULL_REQUEST/labels/ai-review" --silent
